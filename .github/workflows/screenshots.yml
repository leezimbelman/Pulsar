name: Screenshots

# Builds Pulsar, runs it in screenshot mode with sample content, and uploads a PNG of every page
# (dark and light) as the "screenshots" artifact. Run it from the Actions tab after UI changes.
on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build Pulsar/Pulsar.csproj -c Release -p:Platform=x64

      - name: Capture
        shell: pwsh
        run: |
          $exe = Get-ChildItem Pulsar\bin -Recurse -Filter Pulsar.exe | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP "screenshots"
          New-Item -ItemType Directory -Force $out | Out-Null
          $p = Start-Process $exe.FullName -ArgumentList "--screenshots", "`"$out`"" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Warning "Pulsar didn't exit in time" }
          Get-ChildItem $out
          if (Test-Path "$out\error.txt") { Get-Content "$out\error.txt" }

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: error
