name: Release

# Push a tag like v1.0.0 to build the installer and a portable zip and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $v = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}".TrimStart("v") }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Publish (self-contained, x64)
        run: >
          dotnet publish Pulsar/Pulsar.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.value }} -o publish

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish\* -DestinationPath "dist\Pulsar-${{ steps.version.outputs.value }}-win-x64-portable.zip"

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" "/DSourceDir=..\publish" installer\Pulsar.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item installer\Output\*.exe dist\

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: Pulsar ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: dist/*
