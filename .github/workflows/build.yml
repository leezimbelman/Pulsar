name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Pulsar/Pulsar.csproj -p:Platform=x64

      - name: Build
        run: dotnet build Pulsar/Pulsar.csproj -c Release -p:Platform=x64 --no-restore
